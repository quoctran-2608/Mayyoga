name: Normalize navigation shells

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/normalize-navigation-shells.yml
      - scripts/normalize-navigation-shells.mjs

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize public HTML
        run: node scripts/normalize-navigation-shells.mjs

      - name: Audit site architecture
        run: node scripts/audit-site-structure.mjs

      - name: Commit normalized HTML
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No HTML migration changes were needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "refactor(html): replace legacy menus with canonical shells"
          git push
